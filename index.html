<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Join Wi-Fi</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f5f5f7;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: white;
      padding: 24px;
      border-radius: 14px;
      max-width: 320px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }
    button {
      background: #007aff;
      color: white;
      border: none;
      padding: 14px 20px;
      border-radius: 10px;
      font-size: 16px;
      margin-top: 16px;
      width: 100%;
    }
    p {
      color: #555;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Join Wi-Fi</h2>
    <p>Tap below to connect to the network.</p>
    <button onclick="alert('Open Wi-Fi settings and select: Da Crib')">
      Open Wi-Fi Settings
    </button>
    <p style="margin-top:12px;font-size:13px;">
      Network: <strong>Da Crib</strong>
    </p>
  </div>
</body>
</html>
