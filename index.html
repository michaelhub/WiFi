<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Join Wi-Fi</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
    body {
      margin: 0; min-height: 100vh;
      display: grid; place-items: center;
      background: radial-gradient(1200px 800px at 20% 10%, #1b2a4a, #070a12 60%);
      color: #fff;
    }
    .card {
      width: min(520px, 92vw);
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
      backdrop-filter: blur(14px);
    }
    h1 { margin: 0 0 6px; font-size: 26px; letter-spacing: .2px; }
    .sub { margin: 0 0 18px; opacity: .85; line-height: 1.35; }
    .pill {
      display: inline-flex; gap: 10px; align-items: center;
      padding: 10px 12px; border-radius: 999px;
      background: rgba(255,255,255,.10); border: 1px solid rgba(255,255,255,.14);
      font-weight: 650;
    }
    .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
    button {
      appearance: none; border: 0; cursor: pointer;
      padding: 12px 14px; border-radius: 12px;
      font-weight: 800; font-size: 15px;
      background: linear-gradient(135deg, #5ee7ff, #8d7bff);
      color: #070a12;
      box-shadow: 0 12px 30px rgba(93, 185, 255, .22);
    }
    .ghost {
      background: rgba(255,255,255,.10);
      border: 1px solid rgba(255,255,255,.16);
      color: #fff;
      box-shadow: none;
    }
    .panel {
      margin-top: 16px;
      display: none;
      padding: 14px;
      border-radius: 14px;
      background: rgba(0,0,0,.22);
      border: 1px solid rgba(255,255,255,.12);
    }
    .qrWrap { display: grid; place-items: center; padding: 10px; }
    .hint { font-size: 13px; opacity: .85; margin-top: 10px; line-height: 1.45; }
    code { background: rgba(255,255,255,.10); padding: 3px 6px; border-radius: 8px; }
    .toast {
      position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,.65); border: 1px solid rgba(255,255,255,.15);
      padding: 10px 12px; border-radius: 999px; font-weight: 800; display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Join Wi-Fi</h1>
    <p class="sub">Tap <strong>Join Wi-Fi</strong>, then scan the QR code with your camera to connect.</p>

    <div class="pill">📶 Network: <span id="ssidText"></span></div>

    <div class="row">
      <button id="showBtn">Join Wi-Fi</button>
      <button class="ghost" id="copyBtn">Copy Password</button>
    </div>

    <div class="panel" id="panel">
      <div class="qrWrap">
        <canvas id="qr"></canvas>
      </div>
      <div class="hint">
        <strong>iPhone:</strong> Open Camera → scan the QR → tap <em>Join</em>.<br/>
        <strong>Android:</strong> Scan the QR (or use your Wi-Fi list).<br/><br/>
        Password: <code id="pwCode"></code>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">Copied!</div>

  <script src="https://cdn.jsdelivr.net/npm/qrious@4.0.2/dist/qrious.min.js"></script>
  <script>
    // ✅ CHANGE THESE ONLY
    const SSID = "Da Crib";
    const PASS = "sashamako";
    const AUTH = "WPA"; // WPA, WEP, or nopass

    const wifiQR = `WIFI:T:${AUTH};S:${SSID};P:${PASS};;`;

    document.getElementById("ssidText").textContent = SSID;
    document.getElementById("pwCode").textContent = PASS;

    const panel = document.getElementById("panel");
    document.getElementById("showBtn").addEventListener("click", () => {
      panel.style.display = "block";
      new QRious({ element: document.getElementById("qr"), value: wifiQR, size: 260 });
      panel.scrollIntoView({ behavior: "smooth", block: "nearest" });
    });

    const toast = document.getElementById("toast");
    document.getElementById("copyBtn").addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(PASS);
        toast.style.display = "block";
        setTimeout(() => toast.style.display = "none", 1200);
      } catch (e) {
        alert("Copy failed. Password: " + PASS);
      }
    });
  </script>
</body>
</html>
